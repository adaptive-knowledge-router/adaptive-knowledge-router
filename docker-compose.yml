services:

  neo4j:
    image: neo4j:5
    container_name: neo4j-test
    networks: [akr-net]
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  ollama:
    image: ollama/ollama
    container_name: ollama
    networks: [akr-net]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  kg-service:
    build: ./kg-service
    container_name: kg-service
    networks: [akr-net]
    environment:
      NEO4J_URI: bolt://neo4j-test:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
      - ollama

  rag-service:
    build: ./rag-service
    container_name: rag-service
    networks: [akr-net]
    ports:
      - "8002:8002"

  router-service:
    build: ./router-service
    container_name: router-service
    networks: [akr-net]
    ports:
      - "8001:8001"

networks:
  akr-net:
    external: true

volumes:
  neo4j_data:
  ollama_data:
