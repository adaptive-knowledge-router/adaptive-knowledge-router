services:

  neo4j:
    image: neo4j:5
    container_name: neo4j-test
    networks: [akr-net]
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    container_name: ollama
    networks: [akr-net]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  kg-service:
    build: ./kg-service
    container_name: kg-service
    networks: [akr-net]
    environment:
      NEO4J_URI: bolt://neo4j-test:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/kg/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  rag-service:
    build: ./rag-service
    container_name: rag-service
    networks: [akr-net]
    ports:
      - "8002:8002"
    volumes:
      - rag_indexes:/app/indexes
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 30s
      timeout: 10s
      retries: 120
      start_period: 120s

  router-service:
    build: ./router-service
    container_name: router-service
    networks: [akr-net]
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, json; d=json.load(urllib.request.urlopen('http://localhost:8001/health')); exit(0 if d.get('model_loaded') else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  orchestrator:
    build: ./orchestrator
    container_name: orchestrator-service
    ports:
      - "8003:8003"
    depends_on:
      router-service:
        condition: service_healthy
      kg-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    networks:
      - akr-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  akr-net:

volumes:
  neo4j_data:
  ollama_data:
  rag_indexes:
